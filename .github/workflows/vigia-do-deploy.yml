name: Vigia do deploy

# A Cloudflare nao notifica falha do Workers Builds (plano 028). Este workflow le o resultado do
# build de deploy no check run do commit mais recente da `main` e reprova se ele falhou — a
# reprovacao e o que gera o e-mail do GitHub ao ADMIN (F-02, RNF-04). Decisao em ADR-0011.
# Desde 2026-11-23 tambem avisa no Telegram, e o aviso imediato vem do gatilho `check_run`.
on:
  # `schedule`, e nao `push`: o e-mail de um workflow agendado vai para quem alterou o cron por
  # ultimo (o ADMIN); o de `push` iria para quem empurrou, que num save do professor e o TinaCloud.
  # 12:17 UTC (09:17 em Brasilia), fora da hora cheia, quando o GitHub atrasa agendamentos.
  # A execucao diaria pega o que o `check_run` nao ve (build ausente ou preso) e mantem o repo
  # ativo (passo "Manter os agendamentos ativos").
  schedule:
    - cron: '17 12 * * *'
  # Fim do build da Cloudflare: aviso no Telegram na hora, uma vez por build. Um cron de hora em
  # hora repetiria o aviso a cada hora enquanto a `main` seguisse quebrada.
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      testar_telegram:
        description: 'Enviar uma mensagem de teste ao Telegram mesmo com o build verde'
        type: boolean
        default: false

permissions:
  checks: read
  # write: o passo que mantem os agendamentos ativos faz um commit vazio
  contents: write

jobs:
  build-de-deploy:
    # `check_run` dispara para qualquer check de app externo; so o build de deploy interessa
    if: "github.event_name != 'check_run' || github.event.check_run.name == 'Workers Builds: haroldo-page'"
    runs-on: ubuntu-latest
    steps:
      # traz a action local do Telegram e o historico usado para medir a inatividade
      - uses: actions/checkout@v7

      - name: Conferir o Workers Builds do commit mais recente da main
        id: vigia
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK: 'Workers Builds: haroldo-page'
        run: |
          set -euo pipefail
          # o motivo vai para o output antes do exit, para o passo do Telegram citar
          falha() { echo "::error::$1"; echo "motivo=$1" >> "$GITHUB_OUTPUT"; exit 1; }
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          data=$(gh api "repos/$REPO/commits/$sha" --jq .commit.committer.date)
          idade=$(( $(date +%s) - $(date -d "$data" +%s) ))
          echo "commit: $sha ($data), $(( idade / 60 )) min atras"

          check=$(gh api --method GET "repos/$REPO/commits/$sha/check-runs" -f check_name="$CHECK" \
            --jq '.check_runs[0] // empty | [.status, (.conclusion // "-"), .details_url] | @tsv')

          # O check aparece segundos depois do push, ja `in_progress` (visto no plano 028). Sem check
          # ha mais de 30 min, o build nao foi registrado — sintoma do app GitHub <-> Cloudflare
          # desconectado (plano 025).
          if [ -z "$check" ]; then
            if [ "$idade" -gt 1800 ]; then
              falha "Nenhum '$CHECK' em $sha, $(( idade / 60 )) min depois do commit."
            fi
            echo "Sem '$CHECK' ainda, commit com $(( idade / 60 )) min: build em andamento."
            exit 0
          fi

          IFS=$'\t' read -r status conclusao url <<< "$check"
          echo "check: status=$status conclusion=$conclusao"
          echo "build: $url"

          # 60 min, nao 30, para o check que nunca chega a `completed`: o §7.4 da teto de 20 min por
          # build e so 1 build simultaneo no plano gratuito, entao saves em sequencia enfileiram — um
          # limite menor daria alarme falso numa fila legitima, e com uma execucao por dia o custo de
          # esperar mais e nulo.
          if [ "$status" != "completed" ]; then
            if [ "$idade" -gt 3600 ]; then
              falha "Check '$CHECK' de $sha preso em '$status' ha $(( idade / 60 )) min. Log: $url"
            fi
            echo "Build ainda em andamento."
            exit 0
          fi
          case "$conclusao" in
            success | neutral | skipped) echo "Build de deploy verde." ;;
            *)
              falha "Build de deploy de $sha terminou '$conclusao'. O site segue na versao anterior. Log: $url"
              ;;
          esac

      - name: Avisar falha no Telegram
        if: failure()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          titulo: Falha no deploy do site do Haroldo
          texto: ${{ steps.vigia.outputs.motivo || 'O vigia falhou antes de concluir a conferencia (ver o log do run).' }}

      - name: Mensagem de teste no Telegram
        if: inputs.testar_telegram
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          titulo: '[teste] Vigia do deploy do site do Haroldo'
          texto: Mensagem de teste disparada manualmente. Nenhuma falha real.

      # Num repositorio publico o GitHub desliga os workflows agendados apos 60 dias sem atividade,
      # e um workflow desligado nao consegue avisar nada (ADR-0011, "Risco nomeado"). Um commit na
      # `main` e o que zera essa contagem. Aos 45 dias sem commit sobra margem de 15 execucoes
      # diarias. Nao dispara o CI (push com GITHUB_TOKEN nao dispara workflows); o Workers Builds
      # publica de novo o mesmo conteudo.
      - name: Manter os agendamentos ativos
        id: keepalive
        if: always() && github.event_name != 'check_run'
        run: |
          set -euo pipefail
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "ultimo commit na main ha $dias dias"
          if [ "$dias" -lt 45 ]; then exit 0; fi
          git config user.name "André Ferreira"
          git config user.email "160500693+abbadrava@users.noreply.github.com"
          git commit --allow-empty -m "chore: mantém os workflows agendados ativos ($dias dias sem commit)"
          git push
          echo "dias=$dias" >> "$GITHUB_OUTPUT"

      - name: Avisar o commit de manutencao no Telegram
        if: always() && steps.keepalive.outputs.dias
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          titulo: Site do Haroldo sem edicoes ha ${{ steps.keepalive.outputs.dias }} dias
          texto: >-
            Fiz um commit vazio na main para o GitHub nao desligar o vigia e o ORCID (regra dos 60
            dias). Nada a fazer; e so para voce saber que o site esta parado.
